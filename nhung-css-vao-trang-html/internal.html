<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            color: blue;
        }

        p {
            color: green;
            font-style: bold;
        }
    </style>
</head>
<body>
    <h1>This is heading 1</h1>
    <p>This is ordinary paragraph. Notice that this text is blue. 
    The default text color for a page is defined in the body selector.
    </p>
</body>
</html>
